<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Hospital & Medical</title>
  <link rel="stylesheet" href="../css/Login.css">
  <style>
    body {
      margin: 0;
      background-color: #f0f9ff;
      font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-page {
      width: 100%;
      max-width: 1000px;
      padding: 2rem;
      box-sizing: border-box;
    }
    .auth-panel {
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(3, 105, 161, 0.12);
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .auth-panel {
        flex-direction: row;
      }
      .auth-visual, .auth-card {
        flex: 1;
        padding: 3rem;
      }
    }
    .auth-visual {
      background: linear-gradient(135deg, rgba(3, 105, 161, 0.9) 0%, rgba(14, 165, 233, 0.9) 100%);
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .auth-brand {
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .auth-brand img {
      width: 150px;
      margin: 0 auto;
    }
    .auth-card {
      padding: 2rem;
    }
    .auth-copy {
      margin-bottom: 2rem;
    }
    .auth-copy h1 {
      color: #0369A1;
      margin: 0.5rem 0;
    }
    .auth-label {
      color: #0EA5E9;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .auth-form label {
      display: block;
      margin-bottom: 0.5rem;
      color: #0369A1;
      font-weight: 500;
    }
    .auth-form input[type="email"],
    .auth-form input[type="password"],
    .auth-form input[type="text"],
    .auth-form input[type="tel"] {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 0.5rem;
      background-color: #F8FAFC;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
    }
    .role-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .role-option {
      flex: 1;
    }
    .role-box {
      display: block;
      text-align: center;
      padding: 0.75rem;
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #F8FAFC;
      color: #0369A1;
    }
    .role-option input[type="radio"] {
      display: none;
    }
    .role-option input[type="radio"]:checked + .role-box {
      background-color: #0EA5E9;
      color: white;
      border-color: #0EA5E9;
    }
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .auth-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: #0EA5E9;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .auth-submit:hover {
      background-color: #0369A1;
    }
    .link-button {
      background: none;
      border: none;
      color: #0EA5E9;
      cursor: pointer;
      font-weight: 500;
      padding: 0;
    }
    .link-button:hover {
      text-decoration: underline;
    }
    .auth-switch {
      margin-top: 1.5rem;
      text-align: center;
      color: #64748B;
    }
    .auth-switch a {
      color: #0EA5E9;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #0369A1;
      font-weight: 500;
      text-decoration: none;
    }
    .back-home:hover {
      text-decoration: underline;
    }
    .form-message {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .form-message.error {
      color: #EF4444;
    }
    .form-message.success {
      color: #22C55E;
    }
    .hero-text {
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <div class="auth-visual">
        <a class="auth-brand" href="../index.html">
          <img src="../images/logo/logo.webp" alt="Hospital & Medical logo">
        </a>
        <div>
          <p class="visual-label">Hospital & Medical</p>
          <h2>Join Stackly</h2>
          <p class="hero-text">Begin your journey toward better health with South India's most trusted hospital network.</p>
        </div>
      </div>

      <div class="auth-card">
        <div class="auth-copy">
          <p class="auth-label">Start growing</p>
          <h1>Create your account</h1>
          <p class="auth-text">Register to manage services, projects, and business solutions.</p>
        </div>

        <form class="auth-form register-form" novalidate>
          <label>Register as</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="customer" required>
              <span class="role-box">Patients</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="admin" required>
              <span class="role-box">Admin</span>
            </label>
          </div>

          <label for="register-name">Full name</label>
          <input
            id="register-name"
            type="text"
            name="name"
            placeholder="Letters only, max 16"
            minlength="2"
            maxlength="16"
            autocomplete="name"
            required
          >

          <label for="register-email">Email address</label>
          <input id="register-email" type="email" placeholder="you@example.com" required>

          <label for="register-mobile">Mobile number</label>
          <input
            id="register-mobile"
            type="tel"
            placeholder="10-digit mobile number"
            maxlength="10"
            pattern="\d{10}"
            required
          >

          <label for="register-password">Password</label>
          <input
            id="register-password"
            type="password"
            placeholder="Minimum 8 characters"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <label for="confirm-password">Confirm password</label>
          <input
            id="confirm-password"
            type="password"
            placeholder="Re-enter password (min 8)"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <p class="form-message" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Register</button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a href="Login.html">Login</a>
        </p>

        <a class="back-home" href="../index.html">Back to Home</a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var registerForm = document.querySelector(".register-form");
      var formMessage = document.querySelector(".form-message");
      var nameInput = document.querySelector("#register-name");
      var mobileInput = document.querySelector("#register-mobile");
      var passwordInput = document.querySelector("#register-password");
      var isValidEmail = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); };
      var isValidName = function (name) { return /^[A-Za-z ]{2,16}$/.test(name); };

      if (nameInput) {
        nameInput.addEventListener("input", function () {
          this.value = this.value.replace(/[^A-Za-z ]/g, "").slice(0, 16);
        });
      }

      if (mobileInput) {
        mobileInput.addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });
      }

      if (registerForm) {
        registerForm.addEventListener("submit", function (event) {
          event.preventDefault();

          var checkedRole = document.querySelector('input[name="role"]:checked');
          var role = checkedRole ? checkedRole.value : "";
          var name = nameInput.value.trim();
          var email = document.querySelector("#register-email").value.trim();
          var mobile = mobileInput.value.trim();
          var password = passwordInput.value.trim();
          var confirmPassword = document.querySelector("#confirm-password").value.trim();

          if (!role) {
            formMessage.textContent = "Please select Admin or Customer.";
            formMessage.className = "form-message error";
            return;
          }

          if (name.length < 2) {
            formMessage.textContent = "Name must be at least 2 characters.";
            formMessage.className = "form-message error";
            nameInput.focus();
            return;
          }

          if (name.length > 16) {
            formMessage.textContent = "Name must be 16 characters or less.";
            formMessage.className = "form-message error";
            nameInput.focus();
            return;
          }

          if (!isValidName(name)) {
            formMessage.textContent = "Name can contain only letters (A–Z) and spaces.";
            formMessage.className = "form-message error";
            nameInput.focus();
            return;
          }

          if (!/^[A-Za-z]/.test(name) || !/[A-Za-z]$/.test(name)) {
            formMessage.textContent = "Name must start and end with a letter.";
            formMessage.className = "form-message error";
            nameInput.focus();
            return;
          }

          if (!isValidEmail(email)) {
            formMessage.textContent = "Please enter a valid email address.";
            formMessage.className = "form-message error";
            return;
          }

          if (!/^\d{10}$/.test(mobile)) {
            formMessage.textContent = "Please enter a valid 10-digit mobile number.";
            formMessage.className = "form-message error";
            mobileInput.focus();
            return;
          }

          if (password.length < 8) {
            formMessage.textContent = "Password must be at least 8 characters.";
            formMessage.className = "form-message error";
            passwordInput.focus();
            return;
          }

          if (password !== confirmPassword) {
            formMessage.textContent = "Passwords do not match.";
            formMessage.className = "form-message error";
            return;
          }

          localStorage.setItem(
            "profile:" + email.toLowerCase(),
            JSON.stringify({ name: name, role: role })
          );

          formMessage.textContent = "Registration successful. Redirecting to login...";
          formMessage.className = "form-message success";
          registerForm.reset();

          setTimeout(function () {
            window.location.href = "Login.html?role=" + encodeURIComponent(role);
          }, 1000);
        });
      }
    })();
  </script>
</body>
</html>
