<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Hospital & Medical </title>
  <link rel="stylesheet" href="../css/Login.css">
  <style>
    body {
      margin: 0;
      background-color: #f0f9ff;
      font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-page {
      width: 100%;
      max-width: 1000px;
      padding: 2rem;
      box-sizing: border-box;
    }
    .auth-panel {
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(3, 105, 161, 0.12);
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .auth-panel {
        flex-direction: row;
      }
      .auth-visual, .auth-card {
        flex: 1;
        padding: 3rem;
      }
    }
    .auth-visual {
      background: linear-gradient(135deg, rgba(3, 105, 161, 0.9) 0%, rgba(14, 165, 233, 0.9) 100%);
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .auth-brand {
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .auth-brand img {
      width: 150px;
      margin: 0 auto;
    }
    .auth-card {
      padding: 2rem;
    }
    .auth-copy {
      margin-bottom: 2rem;
    }
    .auth-copy h1 {
      color: #0369A1;
      margin: 0.5rem 0;
    }
    .auth-label {
      color: #0EA5E9;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .auth-form label {
      display: block;
      margin-bottom: 0.5rem;
      color: #0369A1;
      font-weight: 500;
    }
    .auth-form input[type="email"],
    .auth-form input[type="password"],
    .auth-form input[type="text"],
    .auth-form input[type="tel"] {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 0.5rem;
      background-color: #F8FAFC;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
    }
    .role-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .role-option {
      flex: 1;
    }
    .role-box {
      display: block;
      text-align: center;
      padding: 0.75rem;
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #F8FAFC;
      color: #0369A1;
    }
    .role-option input[type="radio"] {
      display: none;
    }
    .role-option input[type="radio"]:checked + .role-box {
      background-color: #0EA5E9;
      color: white;
      border-color: #0EA5E9;
    }
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .auth-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: #0EA5E9;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .auth-submit:hover {
      background-color: #0369A1;
    }
    .link-button {
      background: none;
      border: none;
      color: #0EA5E9;
      cursor: pointer;
      font-weight: 500;
      padding: 0;
    }
    .link-button:hover {
      text-decoration: underline;
    }
    .auth-switch {
      margin-top: 1.5rem;
      text-align: center;
      color: #64748B;
    }
    .auth-switch a {
      color: #0EA5E9;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #0369A1;
      font-weight: 500;
      text-decoration: none;
    }
    .back-home:hover {
      text-decoration: underline;
    }
    .form-message, .forgot-message {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .form-message.error, .forgot-message.error {
      color: #EF4444;
    }
    .form-message.success, .forgot-message.success {
      color: #22C55E;
    }
    .hero-text {
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <div class="auth-visual">
        <a class="auth-brand" href="../index.html">
          <img src="../images/logo/logo.webp" alt="Hospital & Medical logo">
        </a>
        <div>
          <p class="visual-label">Hospital & Medical</p>
         <h2>Welcome Back </h2>
         <p class="hero-text">
         Your trusted health partner. Continue your care journey with Stackly's world-class medical services.
         </p>
        </div>
      </div>

      <div class="auth-card">
        <div class="auth-copy">
          <p class="auth-label">Welcome back</p>
          <h1>Login to your account</h1>
          <p class="auth-text">
           Access your dashboard, Patients ,Admin.
          </p>
        </div>

        <form class="auth-form login-form" novalidate>
          <label>Sign in as</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="customer" required>
              <span class="role-box">Patients</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="admin" required>
              <span class="role-box">Admin</span>
            </label>
          </div>

          <label for="login-email">Email address</label>
          <input id="login-email" type="email" placeholder="you@example.com" required autocomplete="username">

          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Max 8 characters" maxlength="8" required autocomplete="current-password">

          <div class="form-row">
            <label class="remember">
              <input type="checkbox" id="remember-me" name="remember">
              <span>Remember me</span>
            </label>
            <button class="link-button forgot-toggle" type="button">Forgot password?</button>
          </div>

          <p class="form-message" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Login</button>
        </form>

        <form class="auth-form forgot-form" novalidate hidden>
          <label for="forgot-email">Registered email address</label>
          <input id="forgot-email" type="email" placeholder="you@example.com" required>
          <p class="forgot-message" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Send reset link</button>
          <button class="link-button back-login" type="button">Back to login</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="Register.html">Create account</a>
        </p>

        <a class="back-home" href="../index.html">Back to Home</a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var loginForm = document.querySelector(".login-form");
      var forgotForm = document.querySelector(".forgot-form");
      var forgotToggle = document.querySelector(".forgot-toggle");
      var backLogin = document.querySelector(".back-login");
      var formMessage = document.querySelector(".form-message");
      var forgotMessage = document.querySelector(".forgot-message");
      var rememberMe = document.querySelector("#remember-me");
      var passwordInput = document.querySelector("#login-password");
      var isValidEmail = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); };

      var dashboards = {
        admin: "admin_Dashboard.html",
        customer: "Patients_Dashboard.html",
      };

      function saveAuth(role, email, name) {
        sessionStorage.setItem("authRole", role);
        sessionStorage.setItem("authEmail", email);
        sessionStorage.setItem("authName", name);
        localStorage.setItem("auth", JSON.stringify({ role: role, email: email, name: name }));
      }

      var params = new URLSearchParams(window.location.search);
      var roleFromUrl = params.get("role");
      if (roleFromUrl && dashboards[roleFromUrl]) {
        var preselectRadio = document.querySelector('input[name="role"][value="' + roleFromUrl + '"]');
        if (preselectRadio) preselectRadio.checked = true;
      }

      if (loginForm) {
        loginForm.addEventListener("submit", function (event) {
          event.preventDefault();

          var checkedRole = document.querySelector('input[name="role"]:checked');
          var role = checkedRole ? checkedRole.value : "";
          var email = document.querySelector("#login-email").value.trim();
          var password = passwordInput.value.trim();

          if (!role) {
            formMessage.textContent = "Please select Admin or Customer.";
            formMessage.className = "form-message error";
            return;
          }

          if (!rememberMe.checked) {
            formMessage.textContent = "Please select the Remember me checkbox to continue.";
            formMessage.className = "form-message error";
            rememberMe.focus();
            alert("Please select the Remember me button.");
            return;
          }

          if (!isValidEmail(email)) {
            formMessage.textContent = "Please enter a valid email address.";
            formMessage.className = "form-message error";
            return;
          }

          if (password.length > 8) {
            formMessage.textContent = "Password allows up to 8 characters only.";
            formMessage.className = "form-message error";
            passwordInput.focus();
            return;
          }

          var profileData = localStorage.getItem("profile:" + email.toLowerCase());
          if (!profileData) {
            formMessage.textContent = "Email address not found. Please register first.";
            formMessage.className = "form-message error";
            return;
          }

          var profile = JSON.parse(profileData);
          var rawName = profile.name || email.split("@")[0];
          var displayName = rawName.charAt(0).toUpperCase() + rawName.slice(1);

          saveAuth(role, email, displayName);

          formMessage.textContent = "Login successful. Redirecting...";
          formMessage.className = "form-message success";

          setTimeout(function () {
            window.location.href = dashboards[role];
          }, 600);
        });
      }

      if (forgotToggle && loginForm && forgotForm) {
        forgotToggle.addEventListener("click", function () {
          loginForm.hidden = true;
          forgotForm.hidden = false;
          formMessage.textContent = "";
          formMessage.className = "form-message";
        });
      }

      if (backLogin && loginForm && forgotForm) {
        backLogin.addEventListener("click", function () {
          forgotForm.hidden = true;
          loginForm.hidden = false;
          forgotMessage.textContent = "";
          forgotMessage.className = "forgot-message";
        });
      }

      if (forgotForm) {
        forgotForm.addEventListener("submit", function (event) {
          event.preventDefault();
          var email = document.querySelector("#forgot-email").value.trim();
          if (!isValidEmail(email)) {
            forgotMessage.textContent = "Please enter a valid email address.";
            forgotMessage.className = "forgot-message error";
            return;
          }
          
          var profileData = localStorage.getItem("profile:" + email.toLowerCase());
          if (!profileData) {
            forgotMessage.textContent = "Email address not found. Please register first.";
            forgotMessage.className = "forgot-message error";
            return;
          }
          
          forgotMessage.textContent = "Password reset link sent successfully.";
          forgotMessage.className = "forgot-message success";
          forgotForm.reset();
        });
      }
    })();
  </script>
</body>
</html>
